const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- dates, distances, pairs ---------------------------------------------------------------
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DAY=864e5;
function span(e){   // start and end of an event as UTC milliseconds. Uses start/end from events.json, or reads "Mar 31–Apr 3" from the built-in list.
  if(e._span)return e._span;
  let s,t;
  if(e.start&&e.end){s=Date.parse(e.start);t=Date.parse(e.end)}
  else{
    const m=/^([A-Za-z]{3}) (\d+)–(?:([A-Za-z]{3}) )?(\d+)$/.exec(e.dates||"");
    if(m){const a=MON.indexOf(m[1]),b=m[3]?MON.indexOf(m[3]):a;s=Date.UTC(2027,a,+m[2]);t=Date.UTC(2027,b,+m[4])}
  }
  return e._span={s,t};
}
const fmtDay=ms=>{const d=new Date(ms);return MON[d.getUTCMonth()]+" "+d.getUTCDate()};
const fmtRange=(a,b)=>new Date(a).getUTCMonth()===new Date(b).getUTCMonth()?fmtDay(a)+"–"+new Date(b).getUTCDate():fmtDay(a)+"–"+fmtDay(b);
const fullDate=iso=>{const d=new Date(iso+"T00:00:00Z");return d.getUTCDate()+" "+MON[d.getUTCMonth()]+" "+d.getUTCFullYear()};
const ageDays=iso=>Math.floor((Date.parse(new Date().toISOString().slice(0,10))-Date.parse(iso))/DAY);
function kmBetween(a,b){
  const R=6371,t=x=>x*Math.PI/180,h=Math.sin(t(b.lat-a.lat)/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(t(b.lng-a.lng)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=k=>k<1?"same place":Math.round(k).toLocaleString("en")+" km";
function pair(a,b){   // how two events fit together: distance, days between, and a plain verdict
  const [f,l]=span(a).s<=span(b).s?[a,b]:[b,a];
  const gap=Math.round((span(l).s-span(f).t)/DAY)-1;      // whole days between the end of the first and the start of the second
  const km=kmBetween(a,b);
  let level,text;
  if(gap<0){level="bad";text="These two overlap, so you cannot attend both."}
  else if(km<100){   // same city or region: the robot does not travel far, so a short gap is fine
    level=gap<1?"warn":"good";
    text=(km<1?"Same venue":"Same area")+", so no long shipping. "+(gap<1?"They run back to back with no free day between.":gap+" day"+(gap===1?"":"s")+" between them.");
  }
  else if(gap<=5){level="warn";text="Tight: only "+gap+" day"+(gap===1?"":"s")+" between them. Shipping and rebuilding the robot is the risk."}
  else if(gap<=13){level="ok";text=gap+" days between them. Workable if you plan the robot shipping early."}
  else{level="good";text=gap+" days between them. Comfortable."}
  return {f,l,gap,km,level,text};
}
const LV={good:"Comfortable",ok:"Workable",warn:"Tight",bad:"Overlap"};

// ---- small UI helpers --------------------------------------------------------------------
let toastTimer;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3200)}
function setBar(id,cls,html){   // one bar under the chips; pass null to remove it
  let el=$(id);
  if(html==null){if(el)el.remove();return null}
  if(!el){el=document.createElement("div");el.id=id;$("bars").appendChild(el)}
  el.className="bar glass "+cls;el.innerHTML=html;return el;
}
function panel(html){   // fills the bottom card / side card with something other than an event
  $("sheet").innerHTML='<div class="grab"></div>'+html;
  $("sheet").classList.add("open");
  const x=$("sheet").querySelector(".x");if(x)x.onclick=closeSheet;
}

const map=L.map("map",{zoomControl:false,minZoom:2,maxZoom:20,worldCopyJump:true,zoomSnap:0,zoomDelta:1,wheelPxPerZoomLevel:90,
  maxBounds:[[-85,-540],[85,540]],maxBoundsViscosity:.6}).setView([30,10],2.4);

const esri=(k,o)=>L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/"+k+"/MapServer/tile/{z}/{y}/{x}",Object.assign({maxZoom:20,maxNativeZoom:19,attribution:"Tiles © Esri, HERE, Garmin, OpenStreetMap contributors"},o||{}));
// Street map: OpenFreeMap vector tiles drawn with MapLibre. They stay sharp at any zoom and cover the whole world,
// including places where Esri's street tiles are blank. If the phone or browser has no WebGL, plain OpenStreetMap tiles are used.
function makeStreet(){
  try{
    const c=document.createElement("canvas");
    if(window.maplibregl&&L.maplibreGL&&(c.getContext("webgl2")||c.getContext("webgl")))
      return L.maplibreGL({style:"https://tiles.openfreemap.org/styles/liberty",
        attribution:'<a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
  }catch(e){}
  return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap contributors"});
}
const street=makeStreet();
const sat=L.layerGroup([esri("World_Imagery"),esri("Reference/World_Boundaries_and_Places",{maxNativeZoom:18})]);
let isSat=false;street.addTo(map);
$("layer").onclick=()=>{
  if(isSat){map.removeLayer(sat);street.addTo(map)}else{map.removeLayer(street);sat.addTo(map)}
  isSat=!isSat;$("layer").textContent=isSat?"Map":"Sat";
};
L.control.scale({imperial:false,position:"bottomleft",maxWidth:110}).addTo(map);

// one dot per regional. Events sharing a city are fanned a few pixels around the exact city centre.
function group(){
  const byPt=new Map();
  E.forEach(e=>{const k=e.lat+","+e.lng;if(!byPt.has(k))byPt.set(k,[]);byPt.get(k).push(e)});
  E.forEach(e=>{const g=byPt.get(e.lat+","+e.lng);e.i=g.indexOf(e);e.n=g.length});
}
group();
const layer=L.layerGroup().addTo(map);
// Filters: any number of weeks can be on at once (tap a week again to turn it off).
// "Favourites" is a separate switch and narrows whatever weeks are on. Nothing on = show everything.
const weeksOn=new Set();
let favOnly=false;
const visible=()=>E.filter(e=>(!weeksOn.size||weeksOn.has(e.week))&&(!favOnly||favs.has(e.code)));
const filterLabel=()=>{
  const p=[];
  if(weeksOn.size)p.push((weeksOn.size>1?"weeks ":"week ")+[...weeksOn].sort((a,b)=>a-b).join(", "));
  if(favOnly)p.push("favourites");
  return p.length?p.join(" · "):"Mar–Apr 2027";
};
const RING=getComputedStyle(document.documentElement).getPropertyValue("--dot-ring").trim();
function place(e){
  if(e.n<2)return[e.lat,e.lng];
  const a=2*Math.PI*e.i/e.n-Math.PI/2,r=e.n>2?13:9,p=map.project([e.lat,e.lng]).add([Math.cos(a)*r,Math.sin(a)*r]);
  return map.unproject(p);
}
// Dot colours. White by default. Once one or more weeks are switched on, each dot takes its week's colour.
// A favourite is gold; in week-colour mode it is split down the middle: week colour on the left, gold on the right.
function starPts(cx,cy,R,r){          // 5-point star, one point straight up
  let p="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;p+=(cx+Math.cos(a)*d).toFixed(2)+","+(cy+Math.sin(a)*d).toFixed(2)+" "}
  return p.trim();
}
const STAR24=starPts(12,12,11,4.6);
const starIcon=(on,cls)=>'<svg class="'+(cls||"ico")+'" viewBox="0 0 24 24" aria-hidden="true"><polygon points="'+STAR24+'" fill="'+(on?"#ffcc00":"none")+'" stroke="'+(on?"#7a5f00":"currentColor")+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const WEEK_COL={1:"#ff3b30",2:"#ff9500",3:"#ffe600",4:"#34c759",5:"#0a84ff",6:"#5856d6",7:"#af52de"}; // red to violet
const WEEK_TXT={1:"#fff",2:"#2a1a00",3:"#2a2400",4:"#062b12",5:"#fff",6:"#fff",7:"#fff"};           // text on a lit week chip
const GOLD="#ffcc00",GOLD_RING="#7a5f00";
function dotIcon(e){
  const fav=favs.has(e.code),byWeek=weeksOn.size>0;
  const base=byWeek?WEEK_COL[e.week]||"#fff":"#fff";
  if(fav){
    // Favourite = star. Gold on its own; with weeks on it is split down the middle: week colour left, gold right.
    const S=32,c=S/2,pts=starPts(c,c+.6,13,5.4),id="h"+e.code.replace(/\W/g,"");
    const body=byWeek
      ?'<defs><clipPath id="'+id+'"><rect x="0" y="0" width="'+c+'" height="'+S+'"/></clipPath></defs>'+
       '<polygon points="'+pts+'" fill="'+GOLD+'"/><polygon points="'+pts+'" fill="'+base+'" clip-path="url(#'+id+')"/>'+
       '<line x1="'+c+'" y1="'+(c-13)+'" x2="'+c+'" y2="'+(c+12)+'" stroke="'+GOLD_RING+'" stroke-width="1.2"/>'+
       '<polygon points="'+pts+'" fill="none" stroke="'+GOLD_RING+'" stroke-width="2" stroke-linejoin="round"/>'
      :'<polygon points="'+pts+'" fill="'+GOLD+'" stroke="'+GOLD_RING+'" stroke-width="2" stroke-linejoin="round"/>';
    return L.divIcon({className:"dot",iconSize:[S,S],iconAnchor:[c,c+.6],popupAnchor:[0,-14],
      html:'<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" aria-hidden="true">'+body+'</svg>'});
  }
  // With weeks on, the week number is printed on the dot too, so colour is never the only clue.
  const r=byWeek?9:7,S=28,c=S/2;
  const num=byWeek?'<text x="'+c+'" y="'+(c+3.8)+'" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui,sans-serif" fill="'+(WEEK_TXT[e.week]||"#000")+'">'+e.week+'</text>':'';
  return L.divIcon({className:"dot",iconSize:[S,S],iconAnchor:[c,c],popupAnchor:[0,-r-2],
    html:'<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" aria-hidden="true"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="'+base+'" stroke="'+RING+'" stroke-width="2"/>'+num+'</svg>'});
}
const markers=[];
function render(){
  layer.clearLayers();markers.length=0;
  const v=visible();
  v.forEach(e=>{
    const m=L.marker(place(e),{icon:dotIcon(e),zIndexOffset:favs.has(e.code)?1000:0,riseOnHover:true,keyboard:true,title:e.name}).addTo(layer);
    m.ev=e;markers.push(m);
    m.bindPopup(()=>popupHtml(e),{closeButton:false,autoPanPaddingTopLeft:[20,110],autoPanPaddingBottomRight:[20,20]});
    m.on("popupopen",x=>{x.popup.getElement().querySelector("[data-c]").onclick=()=>openSheet(e.code)});
    m.on("click",()=>{   // compare mode: the next dot you tap is the second event
      if(cmpFrom&&cmpFrom!==e.code){const a=cmpFrom;m.closePopup();endCompare();showCompare(a,e.code)}
    });
  });
  $("count").textContent=v.length+" regional"+(v.length===1?"":"s")+" · "+filterLabel()+" · "+
    (dataState==="live"?"checked "+fullDate(checkedISO):"built-in list "+fullDate(BUILTIN_DATE));
  favBar();
}
map.on("zoomend",()=>markers.forEach(m=>m.setLatLng(place(m.ev))));
function popupHtml(e){
  const d=document.createElement("div");
  d.innerHTML='<div class="pcity">'+esc(e.city)+'</div><button class="pbtn" data-c="'+e.code+'"><span>'+(favs.has(e.code)?starIcon(true,"ico st")+' ':'')+esc(e.name)+'<small>Week '+e.week+' · '+e.dates+' · tap for details</small>'+(e.changed?'<small class="pchg">Updated '+fmtDay(Date.parse(e.changed.on))+'</small>':'')+'</span></button>';
  return d;
}

function openSheet(code){
  const e=fillSheet(code);if(!e)return;
  map.closePopup();
  map.flyTo([e.lat,e.lng],Math.max(map.getZoom(),8),{duration:.7});
}
function fillSheet(code){
  const e=E.find(x=>x.code===code);if(!e)return null;
  const f=favs.has(code);
  const loc=[e.city,e.st,e.country].filter(Boolean).join(", ");
  $("sheet").innerHTML='<div class="grab"></div>'+
   '<div class="sh-h"><h2>'+esc(e.name)+'</h2><button class="x" id="sx" aria-label="Close">✕</button></div>'+
   '<p class="sub">'+esc(loc)+'</p>'+
   '<div class="badges"><span class="b">'+e.code+'</span><span class="b">Week '+e.week+'</span><span class="b">Regional</span>'+(f?'<span class="b fv">'+starIcon(true,"ico")+' Favourite</span>':'')+'</div>'+
   '<dl><dt>Dates</dt><dd>'+e.dates+', 2027</dd>'+
    (e.venue?'<dt>Venue</dt><dd>'+esc(e.venue)+'</dd>'+(e.addr?'<dt>Address</dt><dd>'+esc(e.addr)+'</dd>':''):'')+
    '<dt>City</dt><dd>'+esc(e.city)+'</dd>'+
    '<dt>State / Province</dt><dd>'+esc(e.st||"—")+'</dd>'+
    '<dt>Country</dt><dd>'+esc(e.country)+'</dd>'+
    '<dt>Team capacity</dt><dd>'+(e.cap?e.cap+' teams':'Not announced')+'</dd>'+
    '<dt>Pin</dt><dd>'+(e.approx?'Approximate (about 2 km)':e.precise?'Matched to the venue':'City centre only')+'</dd>'+
    '<dt>Coordinates</dt><dd>'+e.lat.toFixed(4)+', '+e.lng.toFixed(4)+'</dd></dl>'+
   (e.changed?'<div class="chgnote"><b>Updated '+fmtDay(Date.parse(e.changed.on))+'.</b> '+e.changed.what.map(w=>esc(w).replace("-&gt;","→")).join("; ")+'</div>':'')+
   '<div class="acts"><a class="act p" target="_blank" rel="noopener" href="https://frc-events.firstinspires.org/2027/'+e.code+'">Verify on FIRST</a>'+
    '<button class="act" id="scmp">Compare with…</button>'+
    '<button class="act'+(f?' on':'')+'" id="sf" aria-pressed="'+f+'">'+(f?starIcon(true,"ico")+' Favourited':starIcon(false,"ico")+' Add to favourites')+'</button>'+
    '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+(e.precise?encodeURIComponent(e.venue+' '+e.addr):e.lat+','+e.lng)+'">Open in Maps</a></div>'+
   '<h3>Closest regionals you could also attend</h3>'+closestRows(e)+
   '<p class="note">'+pinNote(e)+' Always confirm dates and the address on the FIRST page before you book.</p>';

  $("sheet").classList.add("open");
  $("sx").onclick=closeSheet;
  $("scmp").onclick=()=>startCompare(code);
  $("sheet").querySelectorAll("[data-cmp]").forEach(b=>b.onclick=()=>showCompare(code,b.dataset.cmp));
  $("sf").onclick=()=>{
    f?favs.delete(code):favs.add(code);saveFavs();render();
    if(favOnly&&f)closeSheet();else fillSheet(code);
  };
  return e;
}
function pinNote(e){
  const n=e.n>1?' '+e.n+' events share this spot, so their dots are nudged a few pixels apart.':'';
  if(e.approx)return 'The dot is close to the venue. FIRST lists it, but the map search could not find it exactly, so the pin was placed by hand and can be about 2 km off.'+n;
  if(e.precise)return 'The dot is on the venue, matched from the address on FIRST\'s event page.'+n;
  if(e.venue)return 'FIRST lists a venue, but it could not be placed on the map automatically, so the dot is at the centre of '+esc(e.city)+'.'+n;
  return 'FIRST has not listed a venue for this event yet, so the dot is at the centre of '+esc(e.city)+'.'+n;
}

// ---- closest events, compare, pairs ------------------------------------------------------
function closestRows(e){   // the 5 nearest other regionals that do not overlap this one in time
  const list=E.filter(x=>x.code!==e.code).map(x=>({x,p:pair(e,x)})).filter(o=>o.p.gap>=0)
    .sort((a,b)=>a.p.km-b.p.km||a.p.gap-b.p.gap).slice(0,5);
  if(!list.length)return '<p class="note">No other regionals to compare.</p>';
  return '<div class="rows">'+list.map(({x,p})=>
    '<button class="row" data-cmp="'+x.code+'"><i class="sw2" style="background:'+(WEEK_COL[x.week]||"#ccc")+'"></i><span><b>'+esc(x.name)+'</b>'+
    '<small>'+esc(x.city)+' · '+fmtKm(p.km)+' · '+p.gap+' day'+(p.gap===1?'':'s')+(span(x).s>span(e).s?' after':' before')+'</small></span>'+
    '<span class="lv '+p.level+'">'+LV[p.level]+'</span></button>').join('')+'</div>';
}
let cmpFrom=null,cmpLine=null;
function clearLine(){if(cmpLine){map.removeLayer(cmpLine);cmpLine=null}}
function startCompare(code){
  const e=E.find(x=>x.code===code);if(!e)return;
  closeSheet();cmpFrom=code;
  setBar("bar-cmp","info","<span>Comparing with <b>"+esc(e.name)+"</b>. Tap another dot.</span><button id=\"cmp-x\">Cancel</button>");
  $("cmp-x").onclick=endCompare;
}
function endCompare(){cmpFrom=null;setBar("bar-cmp","",null)}
function showCompare(ca,cb){
  const a=E.find(x=>x.code===ca),b=E.find(x=>x.code===cb);if(!a||!b)return;
  const p=pair(a,b),wk=Math.abs(a.week-b.week);
  const ev=e=>'<div class="cmp-ev"><i class="sw2" style="background:'+(WEEK_COL[e.week]||"#ccc")+'"></i><div><b>'+esc(e.name)+'</b>'+
    '<small>'+esc(e.city)+', '+esc(e.country)+' · Week '+e.week+' · '+esc(e.dates)+'</small>'+
    '<small>'+(e.venue?esc(e.venue):'Venue not listed yet')+'</small></div></div>';
  const first='https://frc-events.firstinspires.org/2027/';
  panel('<div class="sh-h"><h2>Compare</h2><button class="x" aria-label="Close">✕</button></div>'+
    ev(p.f)+'<div class="arrow">then</div>'+ev(p.l)+
    '<div class="stats"><div><b>'+fmtKm(p.km)+'</b><small>straight-line apart</small></div>'+
    '<div><b>'+(p.gap<0?'Overlap':p.gap+' day'+(p.gap===1?'':'s'))+'</b><small>between events</small></div>'+
    '<div><b>'+wk+' week'+(wk===1?'':'s')+'</b><small>apart</small></div></div>'+
    '<div class="verdict '+p.level+'">'+p.text+'</div>'+
    '<div class="acts"><a class="act p" target="_blank" rel="noopener" href="'+first+p.f.code+'">Verify '+esc(p.f.code)+' on FIRST</a>'+
    '<a class="act p" target="_blank" rel="noopener" href="'+first+p.l.code+'">Verify '+esc(p.l.code)+' on FIRST</a></div>'+
    '<p class="note">Distance is a straight line between the two pins, not travel time. It does not know about registration limits, waitlists, visas or shipping rules, so check those on the FIRST pages.</p>');
  clearLine();
  cmpLine=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:"#0a84ff",weight:3,opacity:.9,dashArray:"7 8"}).addTo(map);
  if(p.km<1)map.flyTo([a.lat,a.lng],15,{duration:.7});
  else{   // frame both pins in the part of the screen the card does not cover
    const side=matchMedia("(min-width:560px),(orientation:landscape) and (max-height:520px)").matches;
    const tl=side?[Math.min(380,innerWidth*.46)+50,150]:[50,170],br=side?[90,80]:[80,Math.round(innerHeight*.56)];
    map.flyToBounds([[a.lat,a.lng],[b.lat,b.lng]],{paddingTopLeft:tl,paddingBottomRight:br,maxZoom:14,duration:.8});
  }
}
function showPairs(){   // every pair among your favourites, best first
  const fv=E.filter(e=>favs.has(e.code));
  const out=[];
  for(let i=0;i<fv.length;i++)for(let j=i+1;j<fv.length;j++)out.push({a:fv[i],b:fv[j],p:pair(fv[i],fv[j])});
  out.sort((x,y)=>(x.p.level==="bad")-(y.p.level==="bad")||x.p.km-y.p.km||y.p.gap-x.p.gap);   // closest first, overlaps last
  panel('<div class="sh-h"><h2>Your '+fv.length+' favourites, paired</h2><button class="x" aria-label="Close">✕</button></div>'+
    '<p class="sub">Closest pairs first, overlaps last. Tap a pair to see it on the map.</p><div class="rows">'+out.slice(0,15).map(o=>
      '<button class="row" data-pa="'+o.a.code+'" data-pb="'+o.b.code+'"><span><b>'+esc(o.p.f.name)+' + '+esc(o.p.l.name)+'</b>'+
      '<small>'+fmtKm(o.p.km)+' · '+(o.p.gap<0?'overlap':o.p.gap+' day'+(o.p.gap===1?'':'s')+' between')+'</small></span>'+
      '<span class="lv '+o.p.level+'">'+LV[o.p.level]+'</span></button>').join('')+'</div>'+
    (out.length>15?'<p class="note">Showing the best 15 of '+out.length+' pairs.</p>':''));
  $("sheet").querySelectorAll("[data-pa]").forEach(b=>b.onclick=()=>showCompare(b.dataset.pa,b.dataset.pb));
}
function favBar(){   // while the Favourites filter is on and you have two or more, offer the pair list
  if(favOnly&&favs.size>=2){
    setBar("bar-fav","info","<span>You have "+favs.size+" favourites.</span><button class=\"go\" id=\"fav-go\">See best pairs</button>");
    $("fav-go").onclick=showPairs;
  }else setBar("bar-fav","",null);
}

addEventListener("orientationchange",()=>setTimeout(()=>map.invalidateSize(),250));

addEventListener("storage",ev=>{if(ev.key!==KEY)return;try{const a=JSON.parse(ev.newValue);favs.clear();(a||[]).forEach(c=>favs.add(c));render()}catch(e){}});

// ---- share a shortlist -------------------------------------------------------------------
function shortlistUrl(){
  const q=[];
  if(favs.size)q.push("fav="+[...favs].join(","));
  if(weeksOn.size)q.push("wk="+[...weeksOn].sort((a,b)=>a-b).join(","));
  return location.origin+location.pathname+(q.length?"?"+q.join("&"):"");
}
$("share").onclick=async()=>{
  if(!favs.size){toast("Star some regionals first, then share your shortlist.");return}
  const url=shortlistUrl();
  try{if(navigator.share){await navigator.share({title:"FRC 2027 regionals shortlist",text:"My shortlist: "+favs.size+" regionals",url});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);toast("Link copied. Paste it in your team chat.")}
  catch(e){
    panel('<div class="sh-h"><h2>Your shortlist link</h2><button class="x" aria-label="Close">✕</button></div><p class="sub">Copy this link and send it to your team.</p><input class="linkbox" id="lb" readonly value="'+esc(url)+'">');
    const lb=$("lb");lb.focus();lb.select();
  }
};
function applySharedParams(){   // opens a link like ?fav=CNGU1,TUIS&wk=4,5
  const q=new URLSearchParams(location.search);
  if(![...q.keys()].length)return;
  const f=(q.get("fav")||"").split(",").map(s=>s.trim().toUpperCase()).filter(c=>E.some(e=>e.code===c));
  const w=(q.get("wk")||"").split(",").map(Number).filter(n=>n>=1&&n<=7);
  history.replaceState(null,"",location.pathname);
  if(w.length){w.forEach(x=>weeksOn.add(x));syncChips();render();$("fit").click()}
  if(!f.length)return;
  const mine=[...favs].sort().join(),theirs=[...new Set(f)].sort().join();
  if(mine===theirs)return;
  const names=f.map(c=>E.find(e=>e.code===c).name).slice(0,3).join(", ")+(f.length>3?" and "+(f.length-3)+" more":"");
  const apply=()=>{favs.clear();f.forEach(c=>favs.add(c));saveFavs();setBar("bar-share","",null);favOnly=false;syncChips();render();toast("Loaded "+f.length+" shared regionals.")};
  if(!favs.size)apply();
  else{
    setBar("bar-share","info","<span>This link has a shortlist of "+f.length+": "+esc(names)+".</span><button class=\"go\" id=\"sh-use\">Use it</button><button id=\"sh-keep\">Keep mine</button>");
    $("sh-use").onclick=apply;$("sh-keep").onclick=()=>setBar("bar-share","",null);
  }
}

// ---- trust: freshness, recent changes, first-visit hint -----------------------------------------
function freshness(){
  if(dataState==="builtin")
    setBar("bar-warn","warn","<span>Could not load the latest data, so this is the built-in list from "+fullDate(BUILTIN_DATE)+". Dates may be out of date. Check the FIRST page before you book anything.</span>");
  else if(ageDays(checkedISO)>2)
    setBar("bar-warn","warn","<span>This data was last checked "+ageDays(checkedISO)+" days ago ("+fullDate(checkedISO)+"). The automatic update may have stopped. Check the FIRST page before you book anything.</span>");
  else setBar("bar-warn","",null);
}
function changesBar(){
  const n=E.filter(e=>e.changed).length+removedList.length;
  if(!n){setBar("bar-chg","",null);return}
  setBar("bar-chg","warn","<span>"+n+" recent change"+(n===1?"":"s")+" on FIRST's list.</span><button id=\"chg-go\">See</button>");
  $("chg-go").onclick=showChanges;
}
function showChanges(){
  const ch=E.filter(e=>e.changed);
  panel('<div class="sh-h"><h2>Recent changes</h2><button class="x" aria-label="Close">✕</button></div><p class="sub">Changes the automatic update found on FIRST\'s list in the last 14 days.</p><div class="rows">'+
    ch.map(e=>'<button class="row" data-open="'+e.code+'"><span><b>'+esc(e.name)+'</b><small>'+fmtDay(Date.parse(e.changed.on))+': '+e.changed.what.map(w=>esc(w).replace("-&gt;","→")).join("; ")+'</small></span></button>').join('')+
    removedList.map(r=>'<div class="row"><span><b>'+esc(r.name)+'</b><small>'+fmtDay(Date.parse(r.on))+': removed from FIRST\'s list</small></span></div>').join('')+'</div>');
  $("sheet").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
}
function introBar(){
  let seen=false;try{seen=localStorage.getItem("frc27-intro")==="1"}catch(e){}
  if(seen)return;
  setBar("bar-intro","info","<span>"+E.length+" regionals. Pick two that are close in place and dates. Tap a dot, then its name, then <b>Compare with…</b>.</span><button id=\"intro-x\" aria-label=\"Dismiss\">✕</button>");
  $("intro-x").onclick=()=>{setBar("bar-intro","",null);try{localStorage.setItem("frc27-intro","1")}catch(e){}};
}

$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();
$("fit").onclick=()=>{
  const pts=visible().map(e=>[e.lat,e.lng]);
  if(pts.length)map.flyToBounds(pts,{padding:[70,70],maxZoom:12,duration:.8});
};
const ml=()=>{const z=map.getZoom();$("zoomlbl").textContent="Zoom "+z.toFixed(1)+(z>=19.5?" · street level":"")};
map.on("zoom",ml);ml();

const chips=$("chips");
const chipEls={};
function syncChips(){
  chipEls.all.setAttribute("aria-pressed",String(!weeksOn.size&&!favOnly));
  chipEls.fav.setAttribute("aria-pressed",String(favOnly));
  for(let w=1;w<=7;w++)chipEls[w].setAttribute("aria-pressed",String(weeksOn.has(w)));
}
[["all","All"],["fav","Favourites"],[1,"Wk 1"],[2,"Wk 2"],[3,"Wk 3"],[4,"Wk 4"],[5,"Wk 5"],[6,"Wk 6"],[7,"Wk 7"]].forEach(([v,l])=>{
  const b=document.createElement("button");b.className="chip"+(v==="fav"?" fav":"");b.textContent=l;
  if(v==="fav"){b.innerHTML=starIcon(true,"ico")+" Favourites"}
  if(typeof v==="number"){   // week chips carry their colour: a small swatch, and the whole chip fills with it when on
    b.className="chip wk";b.textContent="";
    b.style.setProperty("--wc",WEEK_COL[v]);b.style.setProperty("--wt",WEEK_TXT[v]);
    const sw=document.createElement("i");sw.className="sw";
    const t=document.createElement("span");t.className="t";t.innerHTML=l+'<small id="wr'+v+'"></small>';
    b.append(sw,t);
  }
  b.onclick=()=>{
    if(v==="all"){weeksOn.clear();favOnly=false}                 // All = clear every filter
    else if(v==="fav")favOnly=!favOnly;
    else weeksOn.has(v)?weeksOn.delete(v):weeksOn.add(v);        // tap again to deselect
    syncChips();closeSheet();render();$("fit").click();
  };
  chipEls[v]=b;chips.appendChild(b);
});
function weekRanges(){   // date range under each week chip, worked out from the data
  for(let w=1;w<=7;w++){
    const ev=E.filter(e=>e.week===w&&span(e).s);
    const el=$("wr"+w);if(!el)continue;
    el.textContent=ev.length?fmtRange(Math.min(...ev.map(e=>span(e).s)),Math.max(...ev.map(e=>span(e).t))):"";
  }
}
syncChips();
weekRanges();
render();
introBar();

// Pull the latest list that the sync job wrote to events.json. If that fails, the built-in list stays and a warning shows.
fetch("events.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{
  if(!d||!Array.isArray(d.events)||d.events.length<30||!/^\d{4}-\d\d-\d\d$/.test(d.checked||""))throw new Error("bad data");
  E=d.events;group();
  dataState="live";checkedISO=d.checked;removedList=Array.isArray(d.removed)?d.removed:[];
  weekRanges();render();
  if($("sheet").classList.contains("open"))closeSheet();
}).catch(()=>{dataState="builtin";render()})
  .finally(()=>{freshness();changesBar();applySharedParams()});
</script>
</body>
</html>
