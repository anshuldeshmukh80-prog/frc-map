<html lang="en">

<title>FRC 2027 Regionals Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --glass:rgba(255,255,255,.82); --glass-b:rgba(0,0,0,.08); --ink:#1c1c1e; --ink2:#6b6b70;
  --sheet:#fff; --chip:#f0f0f3; --accent:#0a84ff; --star:#ffcc00; --dot-ring:#3a3a3c;
  --shadow:0 4px 18px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){:root{
  --glass:rgba(38,38,42,.82); --glass-b:rgba(255,255,255,.12); --ink:#f5f5f7; --ink2:#a1a1a6;
  --sheet:#1f1f23; --chip:#2c2c31; --accent:#4da3ff; --dot-ring:#111;
}}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;margin:0;background:#e8e4dc;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#map{position:absolute;inset:0;background:#e8e4dc}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid var(--glass-b);box-shadow:var(--shadow)}
#top{position:absolute;z-index:800;left:calc(12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#title{pointer-events:auto;align-self:flex-start;border-radius:14px;padding:8px 14px}
#title b{font-size:15px;letter-spacing:-.01em}#title span{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
#chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:var(--ink);font-weight:600;font-size:13px;line-height:1;font-family:inherit;padding:8px 13px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
.chip.wk{display:inline-flex;align-items:center;gap:6px}
.chip.wk .sw{width:10px;height:10px;border-radius:50%;background:var(--wc);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.chip.wk[aria-pressed=true]{background:var(--wc);color:var(--wt)}
.chip.wk[aria-pressed=true] .sw{box-shadow:0 0 0 1.5px currentColor}
.dot{background:none;border:0}
.dot svg{display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#ctl{position:absolute;z-index:800;right:calc(12px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center}
.grp{border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.grp button,.solo{width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.grp button+button{border-top:1px solid var(--glass-b)}
.solo{border-radius:12px;font-size:13px;font-weight:700;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
.grp button:active,.solo:active{background:var(--glass-b)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#zoomlbl{position:absolute;z-index:800;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;border-radius:8px;padding:5px 8px;color:var(--ink2);font-variant-numeric:tabular-nums}
.leaflet-bottom.leaflet-left{bottom:calc(44px + env(safe-area-inset-bottom,0px))}
.leaflet-control-scale-line{background:var(--glass);color:var(--ink);border-color:var(--ink2);font-size:11px}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;color:var(--ink2)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-bottom.leaflet-right{bottom:calc(0px + env(safe-area-inset-bottom,0px))}
.leaflet-popup-content-wrapper{background:var(--sheet);color:var(--ink);border-radius:14px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--sheet)}
.leaflet-popup-content{margin:10px 12px;min-width:170px}
.pcity{font-size:11px;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.pbtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 0;font-weight:600;font-size:14px;line-height:1.25;font-family:inherit;color:var(--accent);cursor:pointer}
.pbtn+.pbtn{border-top:1px solid var(--glass-b)}
.pbtn .st{color:#e0a800}
.pbtn small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
#sheet{position:absolute;z-index:900;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--sheet);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 28px rgba(0,0,0,.25);padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto}
#sheet.open{transform:none}
@media (min-width:560px),(orientation:landscape) and (max-height:520px){#sheet{left:calc(14px + env(safe-area-inset-left,0px));right:auto;bottom:14px;border-radius:20px;width:min(380px,46vw);max-height:calc(100% - 90px);margin:0}}
@media (orientation:landscape) and (max-height:520px){#sheet{max-height:calc(100% - 112px)}#title span{display:none}#ctl{top:auto;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--glass-b);margin:2px auto 12px}
.sh-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sh-h h2{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.x{border:0;background:var(--chip);color:var(--ink2);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex:none}
.sub{color:var(--ink2);font-size:13.5px;margin:4px 0 14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.b{background:var(--chip);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
dt{color:var(--ink2)}dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.act{flex:1;min-width:120px;text-align:center;text-decoration:none;border:0;cursor:pointer;font-weight:600;font-size:14px;line-height:1;font-family:inherit;padding:12px;border-radius:12px;background:var(--chip);color:var(--ink)}
.act.p{background:var(--accent);color:#fff}
.act.on{background:#ffcc00;color:#3a2f00}
.b.fv{background:#ffcc00;color:#3a2f00}
.chip.fav{display:inline-flex;align-items:center;gap:6px}
.chip.fav[aria-pressed=true]{background:#ffcc00;color:#3a2f00}
.chip.fav[aria-pressed=true] .ico polygon{fill:#3a2f00;stroke:#3a2f00}
.ico{width:15px;height:15px;flex:none;vertical-align:-2px}
.act .ico{width:16px;height:16px;vertical-align:-3px;margin-right:3px}
.b.fv .ico{width:13px;height:13px;vertical-align:-2px}
.pbtn .st{width:13px;height:13px;vertical-align:-1px}
.b.fv .ico polygon,.act.on .ico polygon{fill:#3a2f00;stroke:#3a2f00}
.leaflet-container .maplibregl-canvas{outline:none}
.note{margin-top:14px;font-size:11.5px;color:var(--ink2);line-height:1.4}
.leaflet-interactive{cursor:pointer}
</style>
</head>

let synced="";

// Favourites are saved in this browser (localStorage) so they are still there on the next visit.
// First visit only: start with the two same-city pairs from the research. Set STARTER=[] for a blank start.
const KEY="frc27-favourites",STARTER=["CNGU1","CNGU2","TUIS","TUHC"];
let saved=null;
try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const favs=new Set(Array.isArray(saved)?saved:STARTER);
const saveFavs=()=>{try{localStorage.setItem(KEY,JSON.stringify([...favs]))}catch(e){}};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const map=L.map("map",{zoomControl:false,minZoom:2,maxZoom:20,worldCopyJump:true,zoomSnap:0,zoomDelta:1,wheelPxPerZoomLevel:90,
  maxBounds:[[-85,-540],[85,540]],maxBoundsViscosity:.6}).setView([30,10],2.4);

const esri=(k,o)=>L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/"+k+"/MapServer/tile/{z}/{y}/{x}",Object.assign({maxZoom:20,maxNativeZoom:19,attribution:"Tiles © Esri, HERE, Garmin, OpenStreetMap contributors"},o||{}));
// Street map: OpenFreeMap vector tiles drawn with MapLibre. They stay sharp at any zoom and cover the whole world,
// including places where Esri's street tiles are blank. If the phone or browser has no WebGL, plain OpenStreetMap tiles are used.
function makeStreet(){
  try{
    const c=document.createElement("canvas");
    if(window.maplibregl&&L.maplibreGL&&(c.getContext("webgl2")||c.getContext("webgl")))
      return L.maplibreGL({style:"https://tiles.openfreemap.org/styles/liberty",

// one dot per regional. Events sharing a city are fanned a few pixels around the exact city centre.
function group(){
  const byPt=new Map();
  E.forEach(e=>{const k=e.lat+","+e.lng;if(!byPt.has(k))byPt.set(k,[]);byPt.get(k).push(e)});
  E.forEach(e=>{const g=byPt.get(e.lat+","+e.lng);e.i=g.indexOf(e);e.n=g.length});
}
group();
const layer=L.layerGroup().addTo(map);

// "Favourites" is a separate switch and narrows whatever weeks are on. Nothing on = show everything.
const weeksOn=new Set();
let favOnly=false;
const visible=()=>E.filter(e=>(!weeksOn.size||weeksOn.has(e.week))&&(!favOnly||favs.has(e.code)));
const filterLabel=()=>{
  const p=[];
  if(weeksOn.size)p.push((weeksOn.size>1?"weeks ":"week ")+[...weeksOn].sort((a,b)=>a-b).join(", "));
  if(favOnly)p.push("favourites");
  return p.length?p.join(" · "):"Mar–Apr 2027";
};
const RING=getComputedStyle(document.documentElement).getPropertyValue("--dot-ring").trim();
function place(e){
  if(e.n<2)return[e.lat,e.lng];
  const a=2*Math.PI*e.i/e.n-Math.PI/2,r=e.n>2?13:9,p=map.project([e.lat,e.lng]).add([Math.cos(a)*r,Math.sin(a)*r]);
  return map.unproject(p);
}

// A favourite is gold; in week-colour mode it is split down the middle: week colour on the left, gold on the right.
function starPts(cx,cy,R,r){          // 5-point star, one point straight up
  let p="";for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;p+=(cx+Math.cos(a)*d).toFixed(2)+","+(cy+Math.sin(a)*d).toFixed(2)+" "}
  return p.trim();
}
const STAR24=starPts(12,12,11,4.6);
const starIcon=(on,cls)=>'<svg class="'+(cls||"ico")+'" viewBox="0 0 24 24" aria-hidden="true"><polygon points="'+STAR24+'" fill="'+(on?"#ffcc00":"none")+'" stroke="'+(on?"#7a5f00":"currentColor")+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const WEEK_COL={1:"#ff3b30",2:"#ff9500",3:"#ffe600",4:"#34c759",5:"#0a84ff",6:"#5856d6",7:"#af52de"}; // red to violet
const WEEK_TXT={1:"#fff",2:"#2a1a00",3:"#2a2400",4:"#062b12",5:"#fff",6:"#fff",7:"#fff"};           // text on a lit week chip

function dotIcon(e){
  const fav=favs.has(e.code),byWeek=weeksOn.size>0;
  const base=byWeek?WEEK_COL[e.week]||"#fff":"#fff";
  if(fav){
    // Favourite = star. Gold on its own; with weeks on it is split down the middle: week colour left, gold right.
    const S=32,c=S/2,pts=starPts(c,c+.6,13,5.4),id="h"+e.code.replace(/W/g,"");
    const body=byWeek
      ?'<defs><clipPath id="'+id+'"><rect x="0" y="0" width="'+c+'" height="'+S+'"/></clipPath></defs>'+
       '<polygon points="'+pts+'" fill="'+GOLD+'"/><polygon points="'+pts+'" fill="'+base+'" clip-path="url(#'+id+')"/>'+
       '<line x1="'+c+'" y1="'+(c-13)+'" x2="'+c+'" y2="'+(c+12)+'" stroke="'+GOLD_RING+'" stroke-width="1.2"/>'+
       '<polygon points="'+pts+'" fill="none" stroke="'+GOLD_RING+'" stroke-width="2" stroke-linejoin="round"/>'
      :'<polygon points="'+pts+'" fill="'+GOLD+'" stroke="'+GOLD_RING+'" stroke-width="2" stroke-linejoin="round"/>';
    return L.divIcon({className:"dot",iconSize:[S,S],iconAnchor:[c,c+.6],popupAnchor:[0,-14],
      html:'<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" aria-hidden="true">'+body+'</svg>'});
  }
  const r=7,S=26,c=S/2;
  return L.divIcon({className:"dot",iconSize:[S,S],iconAnchor:[c,c],popupAnchor:[0,-r-2],
    html:'<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" aria-hidden="true"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="'+base+'" stroke="'+RING+'" stroke-width="2"/></svg>'});
}
const markers=[];
function render(){
  layer.clearLayers();markers.length=0;
  const v=visible();
  v.forEach(e=>{
    const m=L.marker(place(e),{icon:dotIcon(e),zIndexOffset:favs.has(e.code)?1000:0,riseOnHover:true,keyboard:true,title:e.name}).addTo(layer);
    m.ev=e;markers.push(m);
    m.bindPopup(()=>popupHtml(e),{closeButton:false,autoPanPaddingTopLeft:[20,110],autoPanPaddingBottomRight:[20,20]});
    m.on("popupopen",x=>{x.popup.getElement().querySelector("[data-c]").onclick=()=>openSheet(e.code)});
  });
  $("count").textContent=v.length+" regional"+(v.length===1?"":"s")+" · "+filterLabel()+(synced?" · synced "+synced:"");
}
map.on("zoomend",()=>markers.forEach(m=>m.setLatLng(place(m.ev))));
function popupHtml(e){
  const d=document.createElement("div");
  d.innerHTML='<div class="pcity">'+esc(e.city)+'</div><button class="pbtn" data-c="'+e.code+'"><span>'+(favs.has(e.code)?starIcon(true,"ico st")+' ':'')+esc(e.name)+'<small>Week '+e.week+' · '+e.dates+' · tap for details</small></span></button>';
  return d;
}

function openSheet(code){
  const e=fillSheet(code);if(!e)return;
  map.closePopup();
  map.flyTo([e.lat,e.lng],Math.max(map.getZoom(),8),{duration:.7});
}
function fillSheet(code){
  const e=E.find(x=>x.code===code);if(!e)return null;
  const f=favs.has(code);
  const loc=[e.city,e.st,e.country].filter(Boolean).join(", ");
  $("sheet").innerHTML='<div class="grab"></div>'+
   '<div class="sh-h"><h2>'+esc(e.name)+'</h2><button class="x" id="sx" aria-label="Close">✕</button></div>'+
   '<p class="sub">'+esc(loc)+'</p>'+
   '<div class="badges"><span class="b">'+e.code+'</span><span class="b">Week '+e.week+'</span><span class="b">Regional</span>'+(f?'<span class="b fv">'+starIcon(true,"ico")+' Favourite</span>':'')+'</div>'+
   '<dl><dt>Dates</dt><dd>'+e.dates+', 2027</dd>'+
    (e.venue?'<dt>Venue</dt><dd>'+esc(e.venue)+'</dd>'+(e.addr?'<dt>Address</dt><dd>'+esc(e.addr)+'</dd>':''):'')+
    '<dt>City</dt><dd>'+esc(e.city)+'</dd>'+
    '<dt>State / Province</dt><dd>'+esc(e.st||"—")+'</dd>'+
    '<dt>Country</dt><dd>'+esc(e.country)+'</dd>'+
    '<dt>Team capacity</dt><dd>'+(e.cap?e.cap+' teams':'Not announced')+'</dd>'+
    '<dt>'+(e.precise?'Venue location':'City centre')+'</dt><dd>'+e.lat.toFixed(4)+', '+e.lng.toFixed(4)+'</dd></dl>'+
   '<div class="acts"><button class="act'+(f?' on':'')+'" id="sf" aria-pressed="'+f+'">'+(f?starIcon(true,"ico")+' Favourited':starIcon(false,"ico")+' Add to favourites')+'</button>'+
    '<a class="act p" target="_blank" rel="noopener" href="https://frc-events.firstinspires.org/2027/'+e.code+'">FIRST event page</a>'+
    '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+(e.precise?encodeURIComponent(e.venue+' '+e.addr):e.lat+','+e.lng)+'">Open in Maps</a></div>'+
   '<p class="note">'+(e.precise?'The dot is on the venue, taken from the official FIRST event page and matched to a map location.':'FIRST has not listed a venue for this event yet, so the dot is at the centre of '+esc(e.city)+'.')+(e.n>1?' '+e.n+' events share this spot, so their dots are nudged a few pixels apart.':'')+'</p>';

  $("sheet").classList.add("open");
  $("sx").onclick=closeSheet;
  $("sf").onclick=()=>{
    f?favs.delete(code):favs.add(code);saveFavs();render();
    if(favOnly&&f)closeSheet();else fillSheet(code);
  };
  return e;
}
function closeSheet(){$("sheet").classList.remove("open")}
map.on("click",closeSheet);
addEventListener("resize",()=>map.invalidateSize());
addEventListener("orientationchange",()=>setTimeout(()=>map.invalidateSize(),250));
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
addEventListener("storage",ev=>{if(ev.key!==KEY)return;try{const a=JSON.parse(ev.newValue);favs.clear();(a||[]).forEach(c=>favs.add(c));render()}catch(e){}});
document.addEventListener("keydown",k=>{if(k.key==="Escape")closeSheet()});

$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();
$("fit").onclick=()=>{
  const pts=visible().map(e=>[e.lat,e.lng]);
  if(pts.length)map.flyToBounds(pts,{padding:[70,70],maxZoom:12,duration:.8});
};
const ml=()=>{const z=map.getZoom();$("zoomlbl").textContent="Zoom "+z.toFixed(1)+(z>=19.5?" · street level":"")};
map.on("zoom",ml);ml();

const chips=$("chips");
const chipEls={};
function syncChips(){
  chipEls.all.setAttribute("aria-pressed",String(!weeksOn.size&&!favOnly));
  chipEls.fav.setAttribute("aria-pressed",String(favOnly));
  for(let w=1;w<=7;w++)chipEls[w].setAttribute("aria-pressed",String(weeksOn.has(w)));
}
[["all","All"],["fav","Favourites"],[1,"Wk 1"],[2,"Wk 2"],[3,"Wk 3"],[4,"Wk 4"],[5,"Wk 5"],[6,"Wk 6"],[7,"Wk 7"]].forEach(([v,l])=>{
  const b=document.createElement("button");b.className="chip"+(v==="fav"?" fav":"");b.textContent=l;
  if(v==="fav"){b.innerHTML=starIcon(true,"ico")+" Favourites"}
  if(typeof v==="number"){   // week chips carry their colour: a small swatch, and the whole chip fills with it when on
    b.className="chip wk";b.textContent="";
    b.style.setProperty("--wc",WEEK_COL[v]);b.style.setProperty("--wt",WEEK_TXT[v]);
    const sw=document.createElement("i");sw.className="sw";b.append(sw,l);
  }
  b.onclick=()=>{
    if(v==="all"){weeksOn.clear();favOnly=false}                 // All = clear every filter
    else if(v==="fav")favOnly=!favOnly;
    else weeksOn.has(v)?weeksOn.delete(v):weeksOn.add(v);        // tap again to deselect
    syncChips();closeSheet();render();$("fit").click();
  };
  chipEls[v]=b;chips.appendChild(b);
});
syncChips();
render();

// Pull the latest list that the sync job wrote to events.json.
fetch("events.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  if(!d||!Array.isArray(d.events)||d.events.length<30)return;
  E=d.events;group();
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],c=String(d.checked||"").split("-");
  synced=c.length===3?mo[c[1]-1]+" "+(+c[2]):"";
  render();
  if($("sheet").classList.contains("open"))closeSheet();
}).catch(()=>{});
</script>
</body>
</html>
