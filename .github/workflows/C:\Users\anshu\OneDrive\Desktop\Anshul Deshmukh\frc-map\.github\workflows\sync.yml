name: Sync events from FIRST

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read FIRST's event list
        run: node scripts/update.mjs
      - name: Save changes
        run: |
          git config user.name "frc-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json coords.json
          git diff --cached --quiet || (git commit -m "Sync events from FIRST" && git push)

